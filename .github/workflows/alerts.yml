name: Incubator alerts
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: alerts
  cancel-in-progress: false
jobs:
  alert:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Send alerts
        run: python incubator_alerts.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_PAIR_CODE: ${{ secrets.TG_PAIR_CODE }}
          TZ: Asia/Kolkata
      - name: Save sent-state
        if: always()
        run: |
          [ -f alerts_sent.json ] || exit 0
          git config user.name "incubator-bot"
          git config user.email "bot@users.noreply.github.com"
          git add alerts_sent.json
          git diff --cached --quiet && exit 0
          git commit -m "alerts state [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
